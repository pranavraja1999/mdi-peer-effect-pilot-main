<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDI Gurgaon — Investment Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A4A;--navy2:#243656;--amber:#D4891A;--amber-lt:#FDF3DC;
  --white:#FFFFFF;--off:#F7F8FA;--slate:#64748B;--light:#E2E8F0;
  --dark:#1E293B;--red:#C0392B;--green:#1A7A44;--mid:#94A3B8;
  --radius:10px;--shadow:0 4px 24px rgba(27,42,74,0.10);
  --font-h:'Libre Baskerville',Georgia,serif;--font-b:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--off);color:var(--dark);min-height:100vh;font-size:15px;line-height:1.6}
.progress-wrap{position:sticky;top:0;z-index:100;background:var(--navy);padding:10px 20px;display:flex;align-items:center;gap:14px}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.2);border-radius:2px}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width 0.5s ease}
.progress-label{font-size:12px;color:rgba(255,255,255,0.7);white-space:nowrap}
.shell{max-width:720px;margin:0 auto;padding:0 16px 60px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 32px;margin-top:24px;border:1px solid var(--light)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--amber)}
.block-badge{background:var(--navy);color:var(--white);font-size:10px;font-weight:600;letter-spacing:0.08em;padding:4px 10px;border-radius:20px;white-space:nowrap;text-transform:uppercase}
.card-title{font-family:var(--font-h);font-size:17px;color:var(--navy)}
.honesty{background:var(--off);border-left:3px solid var(--mid);border-radius:0 6px 6px 0;padding:8px 14px;margin-bottom:18px;font-size:12.5px;color:var(--slate);font-style:italic}
.sec-label{font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--amber);margin:20px 0 8px}
.q-block{margin-bottom:20px}
.q-label{font-size:14px;font-weight:500;color:var(--dark);margin-bottom:8px;line-height:1.55}
.q-num{display:inline-block;background:var(--amber);color:var(--white);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;margin-right:8px;vertical-align:middle}
.q-note{font-size:12px;color:var(--slate);font-style:italic;margin-top:4px}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--light);border-radius:8px;font-family:var(--font-b);font-size:14px;color:var(--dark);background:var(--white);transition:border-color 0.2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(212,137,26,0.15)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.options{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:8px;border:1.5px solid var(--light);cursor:pointer;transition:all 0.15s;font-size:14px;background:var(--white)}
.opt:hover{border-color:var(--amber);background:var(--amber-lt)}
.opt.selected{border-color:var(--amber);background:var(--amber-lt)}
.opt input{margin-top:2px;flex-shrink:0;accent-color:var(--amber)}
.matrix-wrap{overflow-x:auto;margin-top:8px}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th{background:var(--navy);color:var(--white);padding:8px 6px;text-align:center;font-weight:600;font-size:11.5px;border:1px solid var(--navy2)}
.matrix th.stmt-col{text-align:left;width:50%}
.matrix td{padding:9px 6px;border:1px solid var(--light);text-align:center;vertical-align:middle}
.matrix td.stmt{text-align:left;padding-left:10px;font-size:13px;line-height:1.4}
.matrix tr:nth-child(even) td{background:var(--off)}
.matrix input[type=radio]{accent-color:var(--amber);width:16px;height:16px;cursor:pointer}
.task-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.task-table th{background:var(--navy);color:var(--white);padding:9px 10px;font-size:12px;font-weight:600;border:1px solid var(--navy2)}
.task-table td{padding:9px 10px;border:1px solid var(--light);vertical-align:middle;text-align:center}
.task-table tr:nth-child(even) td{background:var(--off)}
.task-table td.row-lbl{font-weight:600;color:var(--navy);width:50px}
.task-table td input[type=radio]{accent-color:var(--amber);width:16px;height:16px;cursor:pointer}
.task-table td input[type=radio]:disabled{opacity:0.35;cursor:not-allowed}
.alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.alloc-item{background:var(--off);border:1.5px solid var(--light);border-radius:8px;padding:11px 14px}
.alloc-asset-name{font-weight:600;font-size:13.5px;color:var(--navy);margin-bottom:2px}
.alloc-asset-sub{font-size:11.5px;color:var(--slate);margin-bottom:7px}
.alloc-total{margin-top:10px;padding:11px 16px;border-radius:8px;background:var(--off);border:1.5px solid var(--light);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.alloc-total-val{font-size:16px;font-weight:700}
.alloc-ok{color:var(--green)}.alloc-err{color:var(--red)}
.info-box{background:var(--off);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:13.5px;color:var(--dark);line-height:1.6}
.warn-box{background:var(--amber-lt);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:13.5px;color:var(--dark);line-height:1.6}
.error-box{background:#fdf0ef;border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:11px 16px;margin:10px 0;font-size:13.5px;color:var(--red);font-weight:500;display:none}
.inst-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.inst-table th{background:var(--navy);color:var(--white);padding:8px 10px;font-size:12px;border:1px solid var(--navy2)}
.inst-table td{padding:8px 10px;border:1px solid var(--light);vertical-align:middle}
.inst-table tr:nth-child(even) td{background:var(--off)}
.peer-card{background:var(--off);border:1.5px solid var(--light);border-radius:10px;padding:13px 18px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.peer-avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.peer-info .peer-name{font-weight:600;color:var(--navy);font-size:13.5px}
.peer-info .peer-sub{color:var(--slate);font-size:12px}
.treatment-box{border-radius:10px;padding:15px 18px;margin-bottom:12px;border:1.5px solid var(--light)}
.treatment-box.luck{background:#FFF9E6;border-color:#E8A020}
.treatment-box.skill{background:#EBF5FF;border-color:#2E75B6}
.pi-ico{display:inline-flex;align-items:center;justify-content:center;color:var(--navy);flex-shrink:0}
.attr-hero{display:flex;gap:20px;align-items:center;border-radius:14px;padding:22px 26px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,0.05)}
.attr-hero.luck{background:linear-gradient(135deg,#FEF6E3 0%,#FBE9C8 100%);border:2px solid #F0C674}
.attr-hero.skill{background:linear-gradient(135deg,#E9F6EE 0%,#D5EDDF 100%);border:2px solid #9BD3AF}
.attr-hero-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:88px}
.attr-hero-body{flex:1}
.attr-hero-title{font-family:var(--font-h);font-size:24px;font-weight:700;line-height:1.15;margin-bottom:10px}
.attr-hero.luck .attr-hero-title{color:#C97A10}
.attr-hero.skill .attr-hero-title{color:#157A3C}
.attr-hero-text{font-size:15.5px;line-height:1.65;color:var(--dark);margin:0}
.attr-hero.luck .attr-hero-text strong{color:#B36F0C;font-weight:700}
.attr-hero.skill .attr-hero-text strong{color:#12703A;font-weight:700}
@media(max-width:560px){
  .attr-hero{flex-direction:column;text-align:center;gap:12px;padding:20px 18px}
  .attr-hero-icon{width:auto}
  .attr-hero-title{font-size:21px}
}
.gap-note{background:rgba(212,137,26,0.12);border-radius:6px;padding:9px 13px;margin-top:9px;font-size:13.5px;font-weight:500;color:var(--dark)}
.timer-bar-wrap{background:var(--light);border-radius:6px;height:8px;margin-bottom:14px;overflow:hidden}
.timer-bar-fill{height:100%;background:var(--green);border-radius:6px;transition:width 1s linear}
.timer-label{font-size:12px;color:var(--slate);margin-bottom:6px;text-align:right}
.return-card{border:1.5px solid var(--light);border-radius:10px;overflow:hidden;margin-bottom:12px}
.return-card-header{background:var(--navy);color:var(--white);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.return-pay-badge{background:var(--amber);color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.return-body{padding:12px 16px}
.return-assets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.return-asset{background:var(--off);border-radius:6px;padding:7px 5px;text-align:center;border:1px solid var(--light)}
.return-asset-name{font-size:11px;font-weight:600;color:var(--navy)}
.return-asset-alloc{font-size:11.5px;color:var(--slate)}
.return-asset-ret{font-size:12.5px;font-weight:700}
.ret-pos{color:var(--green)}.ret-neg{color:var(--red)}.ret-zero{color:var(--slate)}
.return-summary{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-radius:8px;background:var(--off);border:1.5px solid var(--light);font-size:14px;margin-top:6px}
.return-total{font-size:18px;font-weight:700;font-family:var(--font-h)}
.cover{min-height:100vh;background:linear-gradient(rgba(27,42,74,0.75), rgba(27,42,74,0.85)),url('bg.jpg') center/cover no-repeat;;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;position:relative;}
.cover-logo{font-family:var(--font-h);font-size:12px;color:var(--amber);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:36px}
.cover-title{font-family:var(--font-h);font-size:clamp(20px,3.5vw,30px);color:var(--white);line-height:1.3;margin-bottom:10px;max-width:520px}
.cover-sub{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:32px;max-width:440px;line-height:1.6}
.cover-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;width:100%;margin-bottom:32px}
.meta-item{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:11px 15px;text-align:left}
.meta-label{font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px}
.meta-value{font-size:13px;color:var(--white)}
.btn{padding:11px 26px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all 0.2s;font-family:var(--font-b)}
.btn-primary{border-color:var(--amber);background:var(--amber);color:var(--white)}
.btn-primary:hover{background:#b8750f;border-color:#b8750f}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.loading{position:fixed;inset:0;background:rgba(27,42,74,0.7);display:none;align-items:center;justify-content:center;z-index:9999}
.loading-inner{background:var(--white);border-radius:12px;padding:28px 36px;text-align:center}
.spinner{width:36px;height:36px;border:3px solid var(--light);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.end-screen{min-height:80vh;display:flex;align-items:center;justify-content:center}
.end-inner{text-align:center;padding:40px 32px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);max-width:480px}
@media(max-width:600px){.card{padding:18px 16px}.alloc-grid{grid-template-columns:1fr}.cover-meta{grid-template-columns:1fr}.return-assets{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loading-inner"><div class="spinner"></div><div style="font-size:14px;color:var(--slate)">Saving…</div></div></div>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyTPg9FYhs_b0cDR_npAZ8RuQNExqpDeHdHNK65MCiitPBkNl3UAeKd4ls2zG2XPTt0/exec",
  MAX_PARTICIPANTS: 80,
};

// ═══════════════════════════════════════════════════════════════════════════
// ASSET PARAMETERS
// ═══════════════════════════════════════════════════════════════════════════
// Base ASSETS used in Block 3 instructions (Round 1 parameters)
const ASSETS = {
  cash:{ label:"Cash",    mean:0,  sd:0,  ret:"0%",   range:"Always 0%",  desc:"Guaranteed 0% return" },
  L:   { label:"Asset L", mean:4,  sd:6,  ret:"+4%",  range:"-2% to +10%",  desc:"Govt. bonds / debt funds" },
  M:   { label:"Asset M", mean:8,  sd:15, ret:"+8%",  range:"-7% to +23%",  desc:"Large-cap equity index" },

  V:   { label:"Asset V", mean:20, sd:40, ret:"+20%", range:"-20% to +60%", desc:"Derivatives / speculative" },
};

// Round 1 — Base parameters
const ASSETS_R1 = {
  cash:{ label:"Cash",    mean:0,  sd:0,  ret:"0%",   range:"Always 0%",    desc:"Guaranteed 0% return" },
  L:   { label:"Asset L", mean:4,  sd:6,  ret:"+4%",  range:"-2% to +10%",  desc:"Govt. bonds / debt funds" },
  M:   { label:"Asset M", mean:8,  sd:15, ret:"+8%",  range:"-7% to +23%",  desc:"Large-cap equity index" },
  H:   { label:"Asset H", mean:13, sd:25, ret:"+13%", range:"-12% to +38%", desc:"Small-cap equity" },
  V:   { label:"Asset V", mean:20, sd:40, ret:"+20%", range:"-20% to +60%", desc:"Derivatives / speculative" },
};

// Round 2 — Shifted upward slightly
const ASSETS_R2 = {
  cash:{ label:"Cash",    mean:0,  sd:0,  ret:"0%",   range:"Always 0%",    desc:"Guaranteed 0% return" },
  L:   { label:"Asset L", mean:5,  sd:7,  ret:"+5%",  range:"-2% to +12%",  desc:"Govt. bonds / debt funds" },
  M:   { label:"Asset M", mean:10, sd:14, ret:"+10%", range:"-4% to +24%",  desc:"Large-cap equity index" },
  H:   { label:"Asset H", mean:15, sd:23, ret:"+15%", range:"-8% to +38%",  desc:"Small-cap equity" },
  V:   { label:"Asset V", mean:22, sd:38, ret:"+22%", range:"-16% to +60%", desc:"Derivatives / speculative" },
};

// Round 3 — Shifted downward slightly
const ASSETS_R3 = {
  cash:{ label:"Cash",    mean:0,  sd:0,  ret:"0%",   range:"Always 0%",    desc:"Guaranteed 0% return" },
  L:   { label:"Asset L", mean:3,  sd:5,  ret:"+3%",  range:"-2% to +8%",   desc:"Govt. bonds / debt funds" },
  M:   { label:"Asset M", mean:7,  sd:13, ret:"+7%",  range:"-6% to +20%",  desc:"Large-cap equity index" },
  H:   { label:"Asset H", mean:12, sd:22, ret:"+12%", range:"-10% to +34%", desc:"Small-cap equity" },
  V:   { label:"Asset V", mean:18, sd:35, ret:"+18%", range:"-17% to +53%", desc:"Derivatives / speculative" },
};
const ENDOWMENT   = 40000;
const PEER_EARNINGS_EU = 56000; // peer earned around 56,000 EU (40% return on 40,000 EU endowment)

// Fixed peer IDs per treatment arm — formatted to match participant IDs so the
// peer appears to be drawn from the same participant pool.
const PEER_IDS = {
  Luck:        "P_1782648301744_K3M9T",
  Skill:       "P_1782651887203_R7WQ2",
  LuckReflect: "P_1782659412056_B4XN8",
};
function peerId(){ return PEER_IDS[state.condition] || PEER_IDS.Luck; }

// Human silhouette avatar (inline SVG) — replaces the "P42" text avatar
const PEER_AVATAR_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/></svg>`;

// Small info-row icons for the peer detail box
const ICON_IDCARD = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8.5" cy="10" r="2"/><path d="M5 16c0-1.7 1.6-3 3.5-3s3.5 1.3 3.5 3"/><line x1="15" y1="9" x2="19" y2="9"/><line x1="15" y1="13" x2="19" y2="13"/></svg>`;
const ICON_LINK = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>`;
const ICON_COINS = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>`;

// Attribution hero icons — a trophy for the "luck" framing (a windfall reward)
// and a target/precision mark for the "skill" framing (deliberate strategy).
const ATTR_ICON_LUCK = `<svg viewBox="0 0 64 64" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#D4891A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10h24v10a12 12 0 0 1-24 0V10z" fill="#F6C651"/>
    <path d="M20 14h-6a6 6 0 0 0 6 10" fill="#FDF3DC"/>
    <path d="M44 14h6a6 6 0 0 1-6 10" fill="#FDF3DC"/>
    <path d="M32 32v8" />
    <path d="M24 40h16l2 8H22l2-8z" fill="#F6C651"/>
    <path d="M20 52h24" />
  </g>
  <path d="M32 15l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7L32 15z" fill="#E8941C"/>
  <g stroke="#F6C651" stroke-width="2" stroke-linecap="round">
    <path d="M12 8l-2-3M8 14l-3.5-1M54 8l2-3M56 14l3.5-1"/>
  </g>
</svg>`;
const ATTR_ICON_SKILL = `<svg viewBox="0 0 64 64" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1B7A44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="20" fill="#E4F3E9"/>
    <circle cx="32" cy="32" r="13" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="6" fill="#C7E6D2"/>
    <circle cx="32" cy="32" r="1.6" fill="#1B7A44" stroke="none"/>
  </g>
  <path d="M32 6v6M32 52v6M6 32h6M52 32h6" stroke="#1B7A44" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 18l6-6M52 12l-1.5 5 5-1.5" stroke="#1B7A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>`;


// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const state = {
  section:        "cover",
  condition:      null,
  fullName:       "",
  acOrder:        null,
  acRevealed:     false,
  conditionNum:   null,
  lotteryOrder:   null,   // "HL_first" or "LA_first"
  payRound:       null,
  pid:            null,
  email:          null,
  resumeSection:  null,
  compAttempts:   0,
  compQuestion:   1,
  allocs:         {R1:{cash:0,L:0,M:0,H:0,V:0},R2:{cash:0,L:0,M:0,H:0,V:0},R3:{cash:0,L:0,M:0,H:0,V:0}},
  returns:        [],
  answers:        {},
  hlSwitched:     false,
  laSwitched:     false,
  fl2RandomOrder: null,
  hlResult:       null,
  laResult:       null,
  hlPayRow:       null,

function uid(){ return "P_"+Date.now()+"_"+Math.random().toString(36).slice(2,7).toUpperCase(); }

function randNormal(mean,sd){
  if(sd===0) return mean;
  let draw,n=0;
  do{
    let u1=0,u2=0;
    while(u1===0) u1=Math.random();
    while(u2===0) u2=Math.random();
    draw = mean + sd*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
    n++;
  } while((draw<mean-sd||draw>mean+sd)&&n<20);
  return Math.max(mean-sd,Math.min(mean+sd,draw));
}

function calcReturn(alloc, assets){
  assets = assets || ASSETS;
  const total = Object.values(alloc).reduce((a,b)=>a+b,0)||ENDOWMENT;
  let portfolio=0;
  const breakdown={};
  for(const[k,a] of Object.entries(assets)){
    const w=(alloc[k]||0)/total;
    const draw=randNormal(a.mean,a.sd);
    breakdown[k]={w,draw,amt:alloc[k]||0};
    portfolio+=w*draw;
  }
  return{portfolio:parseFloat(portfolio.toFixed(1)),breakdown};
}

function fmt(n){return(n>=0?"+":"")+n.toFixed(1)+"%"}
function fmtINR(n){return "₹"+Math.round(n).toLocaleString("en-IN")}

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function runExplorer(){
  const keys=["cash","L","M","H","V"];
  const alloc={};
  let total=0;
  keys.forEach(k=>{const v=parseFloat(document.getElementById("exp_"+k)?.value)||0;alloc[k]=v;total+=v;});
  if(total!==40000){document.getElementById("exp-error").style.display="block";return;}

  const{portfolio,breakdown}=calcReturn(alloc);
  const portR=parseFloat(portfolio.toFixed(1));

  const endEU=Math.round(40000*(1+portR/100));

function saveData(payload){
  if(!CONFIG.SCRIPT_URL) return;
  const json = JSON.stringify(payload);

  // Primary: fetch POST with no-cors (fire-and-forget, works with Apps Script)
  fetch(CONFIG.SCRIPT_URL, {
    method: "POST",
    mode:   "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body:   "data=" + encodeURIComponent(json),
  }).catch(e => console.warn("POST failed, trying GET:", e));

  // GET fallback removed — prevents duplicate rows in the sheet

  console.log("Saving:", payload.block, "| PID:", payload.pid, "| Email:", payload.email);
}

// key — resuming on one of those produced a blank screen. Map the legacy

const LEGACY_SECTION_MAP = {
  "B1_Demographics":  "block2",
  "B2_FinLit":        "block3",
  "B4_Treatment":     "block4r",
  "B4_AttentionCheck":"prelottery",

  "B11_Returns":      "block11",
  "SURVEY_END":       "block1",
};

// Sections a participant may legitimately be resumed into.
const RESUMABLE_SECTIONS = [
  "block1","block2","block3","block3b","block4","block4r","prelottery",
  "lottery_a","lottery_b","preInvestment","block6","block7","block8",
  "block8s","block9","block9b","block11"
];

function normalizeSection(sec){
  if(!sec) return "block1";
  if(LEGACY_SECTION_MAP[sec]) return LEGACY_SECTION_MAP[sec];
  // Never resume onto the landing/consent screens — those are pre-assignment
  if(sec === "cover" || sec === "participantInfo" || sec === "consent") return "block1";
  // Anything unrecognised restarts from the first post-consent block
  if(RESUMABLE_SECTIONS.indexOf(sec) === -1){
    console.warn("Unrecognised resume section '"+sec+"' — starting from block1");
    return "block1";
  }
  return sec;
}

// ── EMAIL CHECK — JSONP via dynamic script tag ────────────────────────────
// Apps Script does not send CORS headers so fetch() cannot read the response.
// A dynamic <script> tag sidesteps CORS entirely and delivers the callback.
function checkEmailAndStart(email){
  if(!CONFIG.SCRIPT_URL){ state.email=email; startSurvey(); return; }
  showLoading(true);

  const cbName = "_emailCb_" + Date.now();
  let done = false;

  window[cbName] = function(res){
    done = true;
    showLoading(false);
    delete window[cbName];
    const s = document.getElementById("jsonp-email-check");
    if(s) s.remove();

    if(res.status === "complete"){
      document.getElementById("app").innerHTML=`
        <div class="cover" style="justify-content:center">
          <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:36px 32px;max-width:440px;text-align:center">
            <h2 style="font-family:var(--font-h);color:var(--white);margin-bottom:14px">Already Submitted</h2>
            <p style="color:rgba(255,255,255,0.75);font-size:14px;line-height:1.8">
              Our records show that <strong style="color:var(--amber)">${email}</strong> has already completed this survey.<br><br>
              Each participant may submit only once. If you believe this is an error, please contact the research team.
            </p>
            <p style="margin-top:20px;color:rgba(255,255,255,0.4);font-size:12px">Contact: puneet.arora@mdi.ac.in</p>
          </div>
        </div>`;
    } else if(res.status === "partial"){
      state.email = email;
      state.pid   = res.pid || uid();
      state.resumeSection = normalizeSection(res.lastSection);
      // Restore the arm originally assigned to this participant
      if(res.condition){
        state.condition    = res.condition;
        state.conditionNum = res.conditionNum || null;
      }
      if(res.lotteryOrder) state.lotteryOrder = res.lotteryOrder;
      if(res.payRound)     state.payRound     = Number(res.payRound) || null;
      if(!state.condition)    randomCondition();
      if(!state.lotteryOrder) randomLotteryOrder();
      document.getElementById("app").innerHTML=`
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div><div class="progress-label">0% complete</div></div>
        <div class="shell" id="sections-wrap"></div>`;
      goSection(state.resumeSection || "block1");
    } else {
      state.email = email;
      // Server returns the next arm in strict rotation:
      // Control -> Luck -> Skill -> LuckReflect -> repeat
      startSurvey(res.assignedCondition, res.assignedConditionNum);
    }
  };

  // Timeout fallback — if Apps Script doesn't respond in 6s, let them in
  const timer = setTimeout(()=>{
    if(!done){
      done = true;
      showLoading(false);
      delete window[cbName];
      const s = document.getElementById("jsonp-email-check");
      if(s) s.remove();
      console.warn("Email check timed out — falling back to local random assignment");
      state.email = email;
      startSurvey();
    }
  }, 6000);

  const script = document.createElement("script");
  script.id  = "jsonp-email-check";
  script.src = CONFIG.SCRIPT_URL
    + "?action=checkEmail"
    + "&email=" + encodeURIComponent(email)
    + "&callback=" + cbName;
  script.onerror = ()=>{
    clearTimeout(timer);
    if(!done){ done=true; showLoading(false); delete window[cbName]; state.email=email; startSurvey(); }
  };
  document.head.appendChild(script);
}

function resumeSurvey(){
  goSection(state.resumeSection || "block1");
}

function showLoading(show){
  const el = document.getElementById("loading");
  if(el) el.style.display = show ? "flex" : "none";
}

function renderBlock2(){
  progress(22);
  if(!state.fl2RandomOrder) state.fl2RandomOrder=shuffle([0,1,2,3,4]);
  const orderedQs=state.fl2RandomOrder.map(i=>FL_QUESTIONS[i]);
  const maleNames=["Rajesh","Vikram","Suresh","Arjun","Rahul"];
  const femaleNames=["Priya","Meera","Ananya","Sana","Kavya","Deepa","Nisha"];
  const questionsHtml=orderedQs.map((q,qi)=>{
    const isMale=maleNames.some(n=>q.names.includes(n));
    const namePool=isMale?maleNames.filter(n=>q.names.includes(n)):femaleNames.filter(n=>q.names.includes(n));
    const name=namePool[0];
    const optsHtml=q.opts.map(([v,l])=>`<label class="opt" onclick="selectOpt(this,'${q.id}')"><input type="radio" name="${q.id}" value="${v}"><span>${l}</span></label>`).join("");
    return `<div class="q-block">
      <div class="q-label"><span class="q-num">Q${qi+1}</span>${q.q([name])}</div>
      <div class="options">${optsHtml}</div>
    </div>`;
  }).join("");
  return `<div class="card">
    <div class="card-header"><span class="block-badge">Block 2</span><h2 class="card-title">Financial Knowledge</h2></div>
    <div class="warn-box">You have <strong>3 minutes</strong> to complete this section. Answer all questions before the timer runs out.</div>

// showCompSection removed — block3b now auto-initialises comp questions

function showCompQ(num){
  const cqs=getCompQs();
  if(num>cqs.length) return;
  const cq=cqs[num-1];
  state.compQuestion=num;
  const atBanner=document.getElementById("comp-banner");
  if(atBanner) atBanner.textContent=`Attempt ${state.compAttempts+1} of 2, Question ${num} of 3 — answer at least one correctly.`;
  const optsHtml=cq.opts.map(([v,l])=>`<label class="opt" onclick="selectOpt(this,'comp_ans')"><input type="radio" name="comp_ans" value="${v}"><span>${l}</span></label>`).join("");
  document.getElementById("comp-q-wrap").innerHTML=`<div class="q-block" style="margin-top:14px"><div class="q-label">${cq.q}</div><div class="options">${optsHtml}</div></div>`;
  document.getElementById("comp-expl").style.display="none";
  document.getElementById("err-comp").style.display="none";
  const btn=document.getElementById("comp-btn");
  if(btn){btn.textContent="Check Answer →";btn.onclick=submitComp;}
}

function submitComp(){
  const ans=getChecked("comp_ans");
  if(!ans){document.getElementById("err-comp").style.display="block";return;}
  document.getElementById("err-comp").style.display="none";
  const cqs=getCompQs();
  const cq=cqs[state.compQuestion-1];
  if(ans===cq.correct){
    const expl=document.getElementById("comp-expl");
    expl.textContent="✓ Correct! "+cq.expl;
    expl.style.background="#eaf3de";expl.style.borderLeftColor=getComputedStyle(document.documentElement).getPropertyValue("--green");
    expl.style.display="block";
    const btn=document.getElementById("comp-btn");
    btn.textContent="Proceed →";btn.onclick=afterComp;
    const nav=document.getElementById("block3-nav");
    if(nav) nav.style.display="block";
  } else {
    const expl=document.getElementById("comp-expl");
    expl.textContent="Not quite. "+cq.expl;
    expl.style.background="#fdf0ef";expl.style.borderLeftColor="#C0392B";
    expl.style.display="block";
    if(state.compQuestion<cqs.length){
      const btn=document.getElementById("comp-btn");
      btn.textContent="Try Next →";btn.onclick=()=>showCompQ(state.compQuestion+1);
    } else {
      if(state.compAttempts===0){
        state.compAttempts=1;state.compQuestion=1;
        expl.textContent+=" Please re-read the instructions. You have one more attempt.";
        const btn=document.getElementById("comp-btn");
        btn.textContent="Re-read Instructions →";btn.onclick=()=>goSection("block3");
      } else {
        const btn=document.getElementById("comp-btn");
        btn.textContent="End Survey";
        btn.onclick=()=>{
          document.getElementById("sections-wrap").innerHTML=`<div class="end-screen"><div class="end-inner">
            <h2 style="font-family:var(--font-h);color:var(--navy);margin-bottom:12px">Survey Ended</h2>
            <p style="color:var(--slate);font-size:14px;line-height:1.7">You were unable to pass the comprehension check in two attempts. The survey has ended.<br><br>You will receive ₹100 as a participation fee, processed within one week.</p>
            <p style="margin-top:16px;color:var(--mid);font-size:12px">Contact: puneet.arora@mdi.ac.in</p>
          </div></div>`;
          saveBlock("SURVEY_END",{reason:"comp_failed",pid:state.pid});
        };
      }
    }
  }
}

function renderBlock4Recall(){
  progress(45);

  // Build the full question list once, then freeze the randomised order in
  // state so it survives re-renders (e.g. after a wrong-answer reveal).
  if(!state.acOrder){
    const fillers=FILLERS[state.condition]||FILLERS.Control;
    let items=fillers.map(f=>({
      id:f.id, q:f.q, correct:f.correct,
      opts:f.opts.map(o=>[o,o])          // [value, label]
    }));

    if(state.condition!=="Control"){
      const isLuck=state.condition==="Luck"||state.condition==="LuckReflect";
      const pid=peerId();
      items.push({
        id:"ac_combined",
        q:"Which of the following best describes your paired participant's earnings and what they attributed them to?",
        correct:isLuck?"56k_luck":"56k_skill",
        opts:[
          ["56k_luck",  `Paired participant ${pid} earned around 56,000 EU, mainly due to luck.`],
          ["56k_skill", `Paired participant ${pid} earned around 56,000 EU, mainly due to skill.`],
          ["48k_luck",  `Paired participant ${pid} earned around 48,000 EU, mainly due to luck.`],
          ["48k_skill", `Paired participant ${pid} earned around 48,000 EU, mainly due to skill.`],
        ]
      });
    }

    // Randomise question order, and option order within each question
    items = shuffle(items).map(it=>({...it, opts: shuffle(it.opts)}));
    state.acOrder = items;
  }

  const items = state.acOrder;
  const body = items.map((it,qi)=>{
    const opts = it.opts.map(([v,l])=>
      `<label class="opt" onclick="selectOpt(this,'${it.id}')"><input type="radio" name="${it.id}" value="${v}"><span>${l}</span></label>`
    ).join("");
    return `<div class="q-block">

      <div class="options">${opts}</div>
      <div id="fb_${it.id}" class="ac-feedback" style="display:none;margin-top:8px"></div>
    </div>`;
  }).join("");

  return `<div class="card">
    <div class="card-header"><span class="block-badge">Check</span><h2 class="card-title">Attention Check Questions</h2></div>
    <div class="info-box">Before proceeding, please answer the following questions.</div>

    <div id="err-recall" class="error-box">Please answer all questions.</div>

}

function hlChange(row,choice){
  if(!state.hlManual) state.hlManual={};
  state.hlManual[row]=choice;
  // Find the earliest row the participant manually chose B in
  let firstB=-1;
  for(let i=0;i<10;i++){
    if(state.hlManual[i]==="B"){firstB=i;break;}
  }
  // Auto-record B for all rows after the first B; unlock the rest
  for(let i=0;i<10;i++){
    const aEl=document.getElementById(`hl_${i}_A`);
    const bEl=document.getElementById(`hl_${i}_B`);
    if(!aEl) continue;
    if(firstB>=0 && i>firstB){
      // Row is after first B — automatically recorded as Option B
      if(bEl){bEl.checked=true;bEl.disabled=false;bEl.closest("label").style.opacity="1";}
      aEl.checked=false;
      aEl.disabled=true;
      aEl.closest("label").style.opacity="0.4";
    } else {
      // Row is before or at firstB — fully unlocked; restore manual choice if any
      aEl.disabled=false;
      aEl.closest("label").style.opacity="1";
      if(bEl){bEl.disabled=false;bEl.closest("label").style.opacity="1";}
      const m=state.hlManual[i];
      aEl.checked=m==="A";
      if(bEl) bEl.checked=m==="B";
    }
  }
  state.hlSwitched = firstB>=0;
  checkHLComplete();
}

// ── BLOCK 11 — RESULTS ────────────────────────────────────────────────────
function renderBlock11(){
  progress(100);
  randomPayRound();
  const rounds=[1,2,3].map(n=>{
    const alloc=state.allocs[`R${n}`];
    const roundAssets=n===1?ASSETS_R1:n===2?ASSETS_R2:ASSETS_R3;
    const{portfolio,breakdown}=calcReturn(alloc,roundAssets);
    return{n,alloc,portfolio,breakdown,roundAssets};
  });
  state.returns=rounds;
  const payEU=Math.round(ENDOWMENT*(1+parseFloat(rounds[state.payRound-1].portfolio.toFixed(1))/100));
  const payINR=payEU/100;
  // Bonus question: correct if their yes/no prediction matches whether the
  // return in the randomly selected round is at least 20,000 EU
  const belief=state.answers.belief_yn;
  state.bonusCorrect=belief?((belief==="yes")===(payEU>=56000)):false;
  state.bonus=state.bonusCorrect?50:0;
  const hl=state.hlResult;
  const la=state.laResult;
  const l1IsHL=state.lotteryOrder==="HL_first";

  function lotteryCard(res,label,isHL){
    if(!res) return `<div class="return-card"><div class="return-card-header"><span>${label}</span></div><div class="return-body"><p style="color:var(--slate);font-size:13px">No data.</p></div></div>`;
    let rows="";
    if(isHL){
      rows=`<div class="return-summary" style="margin-top:6px"><span>Row randomly selected</span><span style="font-weight:600">Row ${res.row} — Option ${res.choice}</span></div>
        <div class="return-summary" style="margin-top:6px"><span>Outcome drawn</span><span style="font-weight:600">${res.high?"High payoff":"Low payoff"}</span></div>
        <div class="return-summary" style="margin-top:6px;background:var(--amber-lt);border-color:var(--amber)"><span style="font-weight:600">Your payout</span><span style="font-weight:700;color:var(--green);font-size:15px">${fmtINR(res.payout)}</span></div>`;
    } else {
      const col=res.payout>0?"var(--green)":res.payout<0?"var(--red)":"var(--slate)";
      const ot=res.choice==="reject"?"Rejected — no gamble played":res.heads?"Heads — win ₹200":"Tails — lose ₹"+[60,90,120,150,175,200][res.row-1];
      rows=`<div class="return-summary" style="margin-top:6px"><span>Row randomly selected</span><span style="font-weight:600">Row ${res.row}</span></div>
        <div class="return-summary" style="margin-top:6px"><span>Outcome drawn</span><span style="font-weight:600">${ot}</span></div>
        <div class="return-summary" style="margin-top:6px;background:var(--amber-lt);border-color:var(--amber)"><span style="font-weight:600">Your payout</span><span style="font-weight:700;font-size:15px;color:${col}">${res.payout>=0?fmtINR(res.payout):"-"+fmtINR(-res.payout)}</span></div>`;
    }
    return `<div class="return-card"><div class="return-card-header"><span>${label}</span></div><div class="return-body">${rows}</div></div>`;
  }

  const roundCards=rounds.map(r=>{
    const retClass=r.portfolio>0?"ret-pos":r.portfolio<0?"ret-neg":"ret-zero";
    const assetBoxes=Object.entries(r.roundAssets||ASSETS).map(([k,a])=>{
      const amt=r.alloc[k]||0;
      const draw=r.breakdown[k]?.draw??0;
      const cls=draw>0?"ret-pos":draw<0?"ret-neg":"ret-zero";
      return `<div class="return-asset">
        <div class="return-asset-name">${a.label}</div>
        <div class="return-asset-alloc">${(amt/1000).toFixed(0)}k</div>
        ${amt>0?`<div class="return-asset-ret ${cls}">${fmt(draw)}</div>`:"<div style='font-size:11px;color:var(--mid)'>—</div>"}
      </div>`;
    }).join("");
    const endEU=Math.round(ENDOWMENT*(1+parseFloat(r.portfolio.toFixed(1))/100));
    return `<div class="return-card">
      <div class="return-card-header"><span>Investment Round ${r.n}</span></div>
      <div class="return-body">
        <div class="return-assets">${assetBoxes}</div>
        <div class="return-summary"><span>Portfolio return</span><span class="return-total ${retClass}">${fmt(r.portfolio)}</span></div>
        <div class="return-summary" style="margin-top:6px"><span>Final amount</span><span style="font-weight:600">${endEU.toLocaleString("en-IN")} units</span></div>
      </div>
    </div>`;
  }).join("");

  saveBlock("B11_Returns",{pay_round:state.payRound,r1:rounds[0].portfolio,r2:rounds[1].portfolio,r3:rounds[2].portfolio,pay_eu:payEU,pay_inr:payINR,hl_payout:hl?.payout||0,la_payout:la?.payout||0,belief_yn:belief||null,belief_correct:state.bonusCorrect,bonus_inr:state.bonus});

  return `<div class="card">
    <div class="card-header"><span class="block-badge">Your Results</span><h2 class="card-title">All Task Outcomes</h2></div>
    <div class="info-box" style="margin-bottom:14px">Returns across all three investment rounds are determined by independent random draws from the return ranges shown in the asset table. Lottery rows and outcomes were also randomly drawn.</div>
    <div class="sec-label">Lottery 1 — ${l1IsHL?"Choice Task 1":"Choice Task 2"}</div>
    ${lotteryCard(l1IsHL?hl:la,"Lottery 1",l1IsHL)}
    <div class="sec-label" style="margin-top:16px">Lottery 2 — ${l1IsHL?"Choice Task 2":"Choice Task 1"}</div>
    ${lotteryCard(l1IsHL?la:hl,"Lottery 2",!l1IsHL)}
    <div class="sec-label" style="margin-top:16px">Investment Rounds</div>
    ${roundCards}
    <div style="margin-top:20px;padding:16px 20px;background:var(--amber-lt);border:1.5px solid var(--amber);border-radius:10px;text-align:center">
      <p style="font-size:13.5px;color:var(--dark);margin-bottom:12px">All task results are shown above. Click below to reveal which investment round was <strong>randomly</strong> selected for your payment.</p>
      <button class="btn btn-primary" onclick="revealAndFinish()" id="reveal-btn">Reveal My Payment Round →</button>
    </div>
    <div id="final-section" style="display:none;margin-top:20px"></div>
  </div>`;
}

        <tr style="border-bottom:1px solid rgba(255,255,255,0.12)"><td style="padding:8px 4px;color:rgba(255,255,255,0.6)">Lottery 1 payout (Row ${(l1IsHL?hl:la)?.row||"—"})</td><td style="padding:8px 4px;text-align:right;font-weight:600;${l1Col}">${l1Pay>=0?fmtINR(l1Pay):"-"+fmtINR(-l1Pay)}</td></tr>

      </table>
      <p style="color:rgba(255,255,255,0.5);font-size:12px;text-align:center;margin-top:14px">All payments processed within one week.<br>Questions: <strong style="color:var(--amber)">puneet.arora@mdi.ac.in</strong></p>

function randomPayRound(){ state.payRound=Math.floor(Math.random()*3)+1; }
function randomCondition(){
  const arms=["Control","Luck","Skill","LuckReflect"];
  const idx=Math.floor(Math.random()*4);
  state.condition=arms[idx]; state.conditionNum=idx+1;
}
function randomLotteryOrder(){
  state.lotteryOrder=Math.random()<0.5?"HL_first":"LA_first";
}

function startStudy(){
  const nameEl   = document.getElementById("cover_name");
  const emailEl  = document.getElementById("cover_email");
  const nameErr  = document.getElementById("err-cover-name");
  const errEl    = document.getElementById("err-cover-email");
  const fullName = nameEl ? nameEl.value.trim() : "";
  const email    = emailEl ? emailEl.value.trim() : "";

  // Name is required
  if(!fullName || fullName.length < 2){
    if(nameErr) nameErr.style.display = "block";
    if(nameEl) nameEl.focus();
    return;
  }
  if(nameErr) nameErr.style.display = "none";

  // Basic email validation
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    if(errEl) errEl.style.display = "block";
    if(emailEl) emailEl.focus();
    return;
  }
  if(errEl) errEl.style.display = "none";

  state.fullName = fullName;
  checkEmailAndStart(email);
}

function startSurvey(assignedCondition, assignedConditionNum){
  state.pid = uid();
  const arms=["Control","Luck","Skill","LuckReflect"];
  if(assignedCondition && arms.indexOf(assignedCondition) > -1){
    state.condition    = assignedCondition;
    state.conditionNum = Number(assignedConditionNum) || (arms.indexOf(assignedCondition)+1);
  } else {
    // Fallback only — used if the server is unreachable
    randomCondition();
  }
  randomLotteryOrder();
  console.log("Assigned:",state.condition,"| Lotteries:",state.lotteryOrder,"| PID:",state.pid,"| Email:",state.email);
  document.getElementById("app").innerHTML=`
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div><div class="progress-label">0% complete</div></div>
    <div class="shell" id="sections-wrap"></div>`;
  goSection("participantInfo");
}

function submitRecall(){
  const items = state.acOrder || [];
  const d = {};
  let allAnswered = true;
  let anyWrong = false;

  // Collect responses
  items.forEach(it=>{
    const v = getChecked(it.id);
    if(!v) allAnswered = false;
    d[it.id] = v || "";
    d[it.id + "_correct"] = (v === it.correct);
    if(v && v !== it.correct) anyWrong = true;
  });

  if(!allAnswered){
    document.getElementById("err-recall").style.display = "block";
    return;
  }
  document.getElementById("err-recall").style.display = "none";

  // First submit with any wrong answer → reveal the correct answers, let them
  // read the feedback, then allow them to continue on the next click.
  if(anyWrong && !state.acRevealed){
    state.acRevealed = true;

    items.forEach(it=>{
      const v  = getChecked(it.id);
      const fb = document.getElementById("fb_" + it.id);
      if(!fb) return;

      if(v === it.correct){
        fb.innerHTML = `<div style="background:#eaf3de;border-left:4px solid var(--green);border-radius:0 8px 8px 0;padding:9px 14px;font-size:13px;color:var(--dark)">
          <strong>Correct.</strong></div>`;
      } else {
        const correctLabel = (it.opts.find(o=>o[0]===it.correct)||["",it.correct])[1];
        fb.innerHTML = `<div class="warn-box" style="font-size:13px;margin:0">
          <strong>Not quite.</strong> The correct answer is: <strong>${correctLabel}</strong></div>`;
      }
      fb.style.display = "block";
    });

    // Lock the inputs so the revealed answers can't be edited
    items.forEach(it=>{
      document.querySelectorAll(`input[name="${it.id}"]`).forEach(el=>{ el.disabled = true; });
    });

    const rp = document.getElementById("recall-reprompt");
    if(rp){
      rp.innerHTML = `<div class="info-box" style="margin:0">Please review the answers above, then click Continue.</div>`;
      rp.style.display = "block";
    }

    const btn = document.querySelector('[onclick="submitRecall()"]');
    if(btn) btn.textContent = "Continue →";

    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }

  d.reprompted = !!state.acRevealed;
  d.ac_order   = items.map(it=>it.id).join(",");   // randomised presentation order
  saveBlock("B4_AttentionCheck", d);
  goSection("prelottery");
}

function submitHL(){
  const vals=[];
  for(let i=0;i<10;i++){const v=getChecked(`hl_${i}`);if(!v){document.getElementById("err-hl").style.display="block";return;}vals.push(v);}
  document.getElementById("err-hl").style.display="none";
  const sw=vals.findIndex((v,i)=>v==="B"&&(i===0||vals[i-1]==="A"))+1||10;
  const hlRow=(state.hlPayRow||Math.floor(Math.random()*10)+1)-1;
  const hlProb=(hlRow+1)/10;
  const hlHigh=Math.random()<hlProb;
  const hlChoice=vals[hlRow];
  const hlPayout=hlChoice==="A"?(hlHigh?200:160):(hlHigh?350:10);
  state.hlResult={row:hlRow+1,choice:hlChoice,high:hlHigh,payout:hlPayout};
  const d={hl_responses:vals.join(","),hl_switch:sw,hl_pay_row:hlRow+1,hl_choice:hlChoice,hl_high:hlHigh,hl_payout:hlPayout};
  state.answers.hl=d;
  saveBlock("B5_HoltLaury",d);
  // If HL was Lottery A (HL_first), go to Lottery B next; otherwise both done, go to pre-investment
  if(state.lotteryOrder==="HL_first") goSection("lottery_b");
  else goSection("preInvestment");
}

function submitLA(){
  const vals=[];
  for(let i=0;i<6;i++){const v=getChecked(`la_${i}`);if(!v){document.getElementById("err-la").style.display="block";return;}vals.push(v);}
  document.getElementById("err-la").style.display="none";
  const sw=vals.findIndex(v=>v==="reject")+1||7;
  const laRow=(state.laPayRow||Math.floor(Math.random()*6)+1)-1;
  const laChoice=vals[laRow];
  const losses=[60,90,120,150,175,200];
  let laPayout=0;
  let laHeads=false;
  if(laChoice==="accept"){laHeads=Math.random()<0.5;laPayout=laHeads?200:-losses[laRow];}
  state.laResult={row:laRow+1,choice:laChoice,heads:laHeads,payout:laPayout};
  const d={la_responses:vals.join(","),la_switch:sw,la_pay_row:laRow+1,la_choice:laChoice,la_payout:laPayout};
  state.answers.la=d;
  saveBlock("B5b_LossAversion",d);
  // If LA was Lottery A, go to Lottery B next; otherwise both done, go to pre-investment
  if(state.lotteryOrder==="LA_first") goSection("lottery_b");
  else goSection("preInvestment");
}

function submitRound(num,next){
  const keys=["cash","L","M","H","V"];
  const alloc={};
  let total=0;
  keys.forEach(k=>{const el=document.getElementById(`R${num}_${k}`);const v=parseFloat(el?.value)||0;alloc[k]=v;total+=v;});
  if(total!==ENDOWMENT){document.getElementById(`err-round${num}`).style.display="block";return;}
  document.getElementById(`err-round${num}`).style.display="none";
  state.allocs[`R${num}`]=alloc;
  const hiRisk=((alloc.H||0)+(alloc.V||0))/ENDOWMENT;
  saveBlock(`B_Round${num}`,{...alloc,hi_risk_share:hiRisk.toFixed(4),cash_share:((alloc.cash||0)/ENDOWMENT).toFixed(4)});
  goSection(next);
}

function attachHandlers(sec){
  if(sec==="block2"){
    let secs=180;
    const bar=document.getElementById("timer-bar");
    const lbl=document.getElementById("timer-label");
    state.b2Timer=setInterval(()=>{
      secs--;
      const pct=Math.max(0,secs/180*100);
      if(bar) bar.style.width=pct+"%";
      if(bar) bar.style.background=secs<30?"var(--red)":secs<60?"var(--amber)":"var(--green)";
      const m=Math.floor(secs/60),s=secs%60;
      if(lbl) lbl.textContent=`Time remaining: ${m}:${s.toString().padStart(2,"0")}`;
      if(secs<=0){clearInterval(state.b2Timer);submitBlock2();}
    },1000);
  }
  if(["block6","block7","block8"].includes(sec)){
    const rMap={block6:"R1",block7:"R2",block8:"R3"};
    const round=rMap[sec];
    document.querySelectorAll(`input[id^="${round}_"]`).forEach(el=>el.addEventListener("input",()=>updateAllocTotal(round)));
  }
}
